name: Generate snake animation

# Regenerates the contribution-graph snake and commits the SVG to the `output` branch, which the
# README points at. Self-hosted on purpose: the third-party stats cards on the profile go down
# periodically (the shared instance gets rate-limited), whereas this renders from our own repo
# and is therefore always up.
on:
  schedule:
    - cron: '0 */12 * * *'   # twice a day is plenty; the graph changes slowly
  workflow_dispatch:          # manual run, for when you want it refreshed now
  push:
    branches: [main]

concurrency:
  group: snake
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate the snake SVGs
        uses: Platane/snk@v3
        id: snake
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg
            dist/snake-dark.svg?palette=github-dark

      # Pushes to a dedicated `output` branch rather than main, so regenerating the animation
      # never adds noise to the repo's real history.
      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
